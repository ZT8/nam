.nm{font-size:21px;font-weight:800;line-height:1.1}.nm small{display:block;font-size:11px;color:#777;font-weight:500}
.vp{background:#17171f;border:1px solid #23232e;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--ac)}
h2{font-size:26px;font-weight:800;padding:0 4px 4px}
.sub{color:#777;font-size:13px;padding:0 4px 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#14141c;border:1px solid #20202b;border-radius:24px;padding:14px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform .12s,background .25s,color .25s;user-select:none;position:relative;overflow:hidden}
.tile:active{transform:scale(.96)}
.tile.wide{grid-column:span 2;min-height:88px;flex-direction:row;align-items:center;gap:12px}
.tile .ico{font-size:21px;width:40px;height:40px;border-radius:14px;background:#22222d;display:grid;place-items:center;flex:none;transition:.25s}
.tile .tt{font-size:14px;font-weight:700;line-height:1.3}
.tile .ds{font-size:11px;color:#7a7a88;margin-top:3px;line-height:1.35}
.tile .tx{flex:1}
.pill{position:absolute;top:12px;inset-inline-end:12px;font-size:10px;font-weight:800;letter-spacing:.5px;padding:3px 8px;border-radius:10px;background:#22222d;color:#7a7a88;transition:.25s}
.tile.wide .pill{position:static}
.tile.on{background:var(--ac);border-color:var(--ac);color:#000}
.tile.on .ico{background:rgba(0,0,0,.15)}.tile.on .ds{color:rgba(0,0,0,.6)}
.tile.on .pill{background:rgba(0,0,0,.18);color:#000}
.tile.act{background:#14141c}
.tile.act .pill{background:transparent;color:var(--ac);font-size:13px}
/* hero */
.hero{background:linear-gradient(135deg,#181822,#101018);border:1px solid #23232e;border-radius:28px;padding:18px;display:flex;align-items:center;gap:16px;margin-bottom:12px}
.ring{width:84px;height:84px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:800}
.hero .tt{font-size:18px;font-weight:800}.hero .ds{color:#8a8a98;font-size:12px;margin-top:4px;line-height:1.5}
.sec{font-size:12px;color:#6c6c7a;font-weight:700;padding:18px 6px 8px;letter-spacing:.3px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:20px;padding:14px;font-weight:700;font-size:14px;cursor:pointer;border:0;font-family:inherit}
.btn.wa{background:#25d366;color:#052e16}.btn.ig{background:#17171f;border:1px solid #23232e;color:#fff}
.sw-row{display:flex;gap:10px;padding:2px 4px}
.sw-row i{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:.2s}
.sw-row i.on{border-color:#fff}
.seg{display:flex;background:#14141c;border:1px solid #20202b;border-radius:16px;padding:4px}
.seg button{flex:1;background:none;border:0;color:#8a8a98;border-radius:12px;padding:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--ac);color:#000}
/* tab bar */
.tabs{position:absolute;bottom:14px;inset-inline:14px;background:rgba(24,24,32,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid #2a2a36;border-radius:30px;padding:7px;display:flex;gap:2px;z-index:5}
.tabs button{flex:1;background:none;border:0;color:#7d7d8b;border-radius:24px;padding:9px 0 8px;font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:inherit;transition:.25s}
.tabs button b{font-size:19px;font-weight:400;line-height:1}
.tabs button.on{background:var(--ac);color:#000}
.foot{text-align:center;color:#4c4c58;font-size:12px;padding:24px 0}
.toast{position:absolute;top:18px;left:50%;transform:translate(-50%,-80px);background:#fff;color:#000;border-radius:20px;padding:9px 16px;font-size:13px;font-weight:700;z-index:9;transition:.3s}
.toast.show{transform:translate(-50%,0)}
.note{color:#888;font-size:13px;text-align:center;max-width:390px}

.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0;pointer-events:none;transition:opacity .4s,background .3s}
.o1{width:300px;height:300px;top:-60px;inset-inline-start:-90px;background:var(--ac)}
.o2{width:300px;height:300px;top:330px;inset-inline-end:-120px;background:#6a4dff}
.o3{width:260px;height:260px;bottom:-60px;inset-inline-start:-40px;background:#00b7ff}
.glass{background:linear-gradient(145deg,#0a0c1c,#101640 55%,#07091a)}
.glass .orb{opacity:.5}.glass .o3{opacity:.35}.glass .glow{opacity:0}
.glass .tile,.glass .hero{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 24px rgba(0,0,0,.25)}
.glass .tile.on{background:linear-gradient(145deg,color-mix(in srgb,var(--ac) 88%,#fff 12%),color-mix(in srgb,var(--ac) 62%,transparent));border-color:rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 28px color-mix(in srgb,var(--ac) 35%,transparent)}
.glass .tile .ico{background:rgba(255,255,255,.10)}
.glass .tile.on .ico{background:rgba(255,255,255,.28)}
.glass .pill{background:rgba(255,255,255,.12)}
.glass .tile.on .pill{background:rgba(0,0,0,.2)}
.glass .vp,.glass .seg{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.glass .tabs{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 10px 30px rgba(0,0,0,.4)}
.glass .tabs button{color:rgba(255,255,255,.6)}
.glass .tabs button.on{background:linear-gradient(145deg,color-mix(in srgb,var(--ac) 90%,#fff 10%),color-mix(in srgb,var(--ac) 70%,transparent));color:#000;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.glass .ring circle:first-child{stroke:rgba(255,255,255,.12)}
.glass .sub,.glass .sec,.glass .foot{color:rgba(255,255,255,.5)}
</style>
</head>

["rep","↻","إيقاف تكرار الفيديو","ريلز، منشورات، ستوري، خاص","No video repeat","Reels, posts, stories, DMs",0,"w"],
["anon",'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>',"ستوري بالخفاء","بدون ظهور اسمك","Anonymous stories","Without showing your name",0,"w"],
["adv","❚❚","بدون انتقال تلقائي","للستوري التالية","No auto-advance","Next story",0],
["men","@","إظهار المنشن","في الستوري","Show mentions","In stories",1],
["rr","✓","إخفاء القراءة","لا يظهر إنك قريت","Hide read receipts","Chats only",0],
["ty","…","إخفاء «يكتب الآن»","","Hide typing","",0],
["vm","〰","تحميل الرسائل الصوتية","احفظ أي رسالة صوتية","Download voice messages","Save any voice note",1,"w"],
["dlm","⌫","الاحتفاظ بالرسائل المحذوفة","تبقى الرسالة ظاهرة حتى لو حذفها الطرف الثاني","Keep deleted messages","Stays visible even if unsent",0,"w"],
["ss","◎","إخفاء إشعار السكرين شوت","وإعادة العرض بدون ما ينبّه الطرف الثاني","Hide screenshot alert","And replay without notifying",0,"w"],
["sp","▣","السماح بتصوير وسائط الخاص","صور وفيديوهات العرض لمرة واحدة","Allow screenshots of DM media","View-once photos & videos",0,"w"],
["v2m","🎙","تحويل لرسالة صوتية","حوّل أي صوت أو فيديو لرسالة صوتية","Convert to voice message","Turn any audio or video into a voice note",0,"w"],
["rec","⏱","رفع مدة التسجيل","تسجيل أطول للرسائل الصوتية","Longer recording","Extend voice note limit",0,"w"],
["lk","♥","تأكيد الإعجاب","قبل التنفيذ","Confirm like","Before action",0],
["fl","+","تأكيد المتابعة","قبل التنفيذ","Confirm follow","Before action",0],
["cp","⧉","نسخ النص","التعليقات والوصف","Copy text","Comments & captions",1],
["fy","⚇","هل يتابعك؟","يظهر على الحساب","Follows you?","Shown on profile",1],
["lc","♡","عدد الإعجابات والمشاهدات","إظهارها دائماً","Like & view counts","Always show",0],
["sf","⌖","روابط في سفاري","بدل المتصفح الداخلي","Links in Safari","Instead of in-app",0],
["ad","⊘","إزالة الإعلانات","المنشورات الممولة","Remove sponsored","Sponsored posts",1],
["lock","☺","قفل التطبيق","بصمة الوجه أو رمز الدخول","App lock","Face ID or passcode",0,"w"]
];
const PAGES=[
 {id:"home",i:"⌂",ar:"الرئيسية",en:"Home"},
 {id:"dl",i:"⬇︎",ar:"التحميل",en:"Download",f:["dl","hq","sh","rep"]},
 {id:"st",i:"◌",ar:"الستوري",en:"Stories",f:["anon","adv","men"]},
 {id:"dm",i:"✉︎",ar:"الخاص",en:"Direct",f:["rr","ty","dlm","ss","sp","vm","v2m","rec","cl"]},
 {id:"more",i:"⋯",ar:"المزيد",en:"More",f:["lk","fl","cp","fy","lc","sf","ad","lock"]}
];
const DELAYS=[["فوراً","Immediately"],["دقيقة","1 min"],["5 دقائق","5 min"],["15 دقيقة","15 min"]];
const COLORS=["#c6ff3d","#4da3ff","#ff5ca8","#ff9f43","#b48cff","#a8a8b3"];
let lang="ar",page="home",delay=0,color=0,glass=true;
const st={};F.forEach(f=>st[f[0]]=f[6]);
const T=(a,b)=>lang==="ar"?a:b;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1400)}
function tile(f,half){
  const [id,ic,at,ad,et,ed,,sz0]=f,on=st[id],sz=half==='wide'?'w':(half?'':sz0);
  return `<div class="tile${sz==='w'?' wide':''}${on?' on':''}" data-f="${id}"><div class="ico">${ic}</div><div class="tx"><div class="tt">${T(at,et)}</div>${(T(ad,ed))?`<div class="ds">${T(ad,ed)}</div>`:''}</div><span class="pill">${on?'ON':'OFF'}</span></div>`;
}
function head(t,s){return `<div class="top"><div class="brand"><div class="mk"></div><div class="nm">HIDE<small>hide-plus.com</small></div></div><div class="vp">v${V}</div></div><h2>${t}</h2><div class="sub">${s}</div>`}
function render(){
  const scr=document.getElementById('scr');scr.style.setProperty('--ac',COLORS[color]);scr.classList.toggle('glass',glass);scr.dir=lang==='ar'?'rtl':'ltr';
  const p=PAGES.find(x=>x.id===page);let h=`<div class="page" id="p">`;
  const count=F.filter(f=>st[f[0]]).length,tot=F.length,circ=2*Math.PI*34;
  if(page==='home'){
    h+=head(T("أهلاً بك","Welcome"),T("تحكّم بتجربة إنستقرام من مكان واحد","Control your Instagram from one place"));
    h+=`<div class="hero"><div class="ring"><svg width="84" height="84"><circle cx="42" cy="42" r="34" fill="none" stroke="#23232e" stroke-width="8"/><circle cx="42" cy="42" r="34" fill="none" stroke="${COLORS[color]}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-count/tot)}" style="transition:.4s"/></svg><b>${count}</b></div><div><div class="tt">${T("ميزة مفعّلة","features active")}</div><div class="ds">${T(`${count} من ${tot} ميزة تعمل الآن`,`${count} of ${tot} features running`)}</div></div></div>`;
    h+=`<div class="sec">${T("وصول سريع","QUICK ACCESS")}</div><div class="grid">`;
    ["anon","rr","dl","rep"].forEach(id=>h+=tile(F.find(f=>f[0]===id),'wide'));
    h+=`</div><div class="sec">${T("الأقسام","SECTIONS")}</div><div class="grid">`;
    PAGES.slice(1).forEach(x=>{const n=x.f.filter(i=>st[i]).length;h+=`<div class="tile act" data-go="${x.id}"><div class="ico">${x.i}</div><div><div class="tt">${T(x.ar,x.en)}</div><div class="ds">${n}/${x.f.length}</div></div><span class="pill">${lang==='ar'?'‹':'›'}</span></div>`});
    h+=`</div><div class="sec">${T("المطور","DEVELOPER")}</div><div class="grid"><button class="btn wa" data-t="wa">✆ ${T("واتساب","WhatsApp")}</button><button class="btn ig" data-t="ig">◉ @hidestores</button></div>`;
  } else {
    h+=head(T(p.ar,p.en),T(`${p.f.filter(i=>st[i]).length} من ${p.f.length} مفعّل`,`${p.f.filter(i=>st[i]).length} of ${p.f.length} on`));
    h+=`<div class="grid">`;
    p.f.map(i=>F.find(f=>f[0]===i)).forEach(f=>{
      h+=tile(f);
      if(f[0]==='lock'&&st.lock) h+=`<div class="tile wide act" data-delay><div class="ico">◷</div><div class="tx"><div class="tt">${T("وقت القفل","Lock delay")}</div><div class="ds">${T("اضغط للتبديل","Tap to change")}</div></div><span class="pill">${DELAYS[delay][lang==='ar'?0:1]}</span></div>`;
    });
    h+=`</div>`;
    if(page==='more'){
      h+=`<div class="sec">${T("لون التطبيق","ACCENT")}</div><div class="sw-row">${COLORS.map((c,i)=>`<i data-c="${i}" class="${i===color?'on':''}" style="background:${c}"></i>`).join('')}</div>`;
      h+=`<div class="sec">${T("النمط","STYLE")}</div><div class="seg"><button data-g="0" class="${glass?'':'on'}">${T("عادي","Solid")}</button><button data-g="1" class="${glass?'on':''}">${T("زجاجي","Glass")}</button></div>`;
      h+=`<div class="sec">${T("اللغة","LANGUAGE")}</div><div class="seg"><button data-l="ar" class="${lang==='ar'?'on':''}">العربية</button><button data-l="en" class="${lang==='en'?'on':''}">English</button></div>`;
      h+=`<div class="sec">${T("حول","ABOUT")}</div><div class="grid"><div class="tile act" style="min-height:90px"><div class="ico">i</div><div><div class="tt">${T("الإصدار","Version")}</div><div class="ds">HIDE ${V}</div></div></div><div class="tile act" style="min-height:90px"><div class="ico">◉</div><div><div class="tt">Instagram</div><div class="ds">@hidestores</div></div></div><div class="tile wide act" style="grid-column:span 2"><div class="ico">✓</div><div class="tx"><div class="tt">${T("تقرير التوافق","Compatibility")}</div><div class="ds">${T("كل الأجزاء موجودة","All hooks found")}</div></div><span class="pill">407.0.0</span></div></div>`;
    }
  }
  h+=`<div class="foot">HIDE v${V} · hide-plus.com</div></div>`;
  document.getElementById('pg').innerHTML=h;
  document.getElementById('tabs').innerHTML=PAGES.map(x=>`<button data-tab="${x.id}" class="${x.id===page?'on':''}"><b>${x.i}</b>${T(x.ar,x.en)}</button>`).join('');
  const pe=document.getElementById('p');
  pe.querySelectorAll('[data-f]').forEach(e=>e.onclick=()=>{const id=e.dataset.f;st[id]=st[id]?0:1;const sc=pe.scrollTop;render();document.getElementById('p').scrollTop=sc});
  pe.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>{page=e.dataset.go;render()});
  pe.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>{color=+e.dataset.c;const sc=pe.scrollTop;render();document.getElementById('p').scrollTop=sc});
  pe.querySelectorAll('[data-g]').forEach(e=>e.onclick=()=>{glass=e.dataset.g==='1';const sc=pe.scrollTop;render();document.getElementById('p').scrollTop=sc});
  pe.querySelectorAll('[data-l]').forEach(e=>e.onclick=()=>{lang=e.dataset.l;const sc=pe.scrollTop;render();document.getElementById('p').scrollTop=sc});
  pe.querySelectorAll('[data-delay]').forEach(e=>e.onclick=()=>{delay=(delay+1)%DELAYS.length;const sc=pe.scrollTop;render();document.getElementById('p').scrollTop=sc});
  pe.querySelectorAll('[data-t]').forEach(e=>e.onclick=()=>toast(T("يفتح الرابط في التطبيق","Opens the link in the app")));
  document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{page=e.dataset.tab;render()});
}
render();
</script>
<script>
window.__HIDEInitialSnapshot={"version": "1.9.3", "features": {"dl": true, "hq": true, "sh": false, "rep": false, "anon": false, "adv": false, "men": true, "rr": false, "ty": false, "vm": true, "dlm": false, "ss": false, "rp": false, "sp": false, "v2m": false, "rec": false, "lk": false, "fl": false, "cp": true, "fy": true, "lc": false, "sf": false, "ad": true, "lock": false, "live": false, "sv": false, "timer": false, "cl": false}, "available": {"dl": true, "hq": true, "sh": true, "rep": true, "anon": true, "adv": true, "men": true, "rr": true, "ty": true, "vm": true, "dlm": true, "ss": true, "rp": true, "sp": true, "v2m": true, "rec": true, "lk": true, "fl": true, "cp": true, "fy": true, "lc": true, "sf": true, "ad": true, "lock": true, "live": true, "sv": true, "timer": true, "cl": false}, "language": "ar", "color": 0, "glass": true, "delay": 0, "delaySeconds": 0};
window.HIDEPreviewRPC=[];
    try { const saved=JSON.parse(localStorage.getItem('hide-app-preview')||'null');if(saved)Object.assign(__HIDEInitialSnapshot,saved); }catch(e){}
    window.webkit={messageHandlers:{hideSettings:{postMessage(message){
      HIDEPreviewRPC.push(message);
      const s=__HIDEInitialSnapshot;
      if(message.action==='feature')s.features[message.id]=message.value;
      if(['color','glass','language'].includes(message.action))s[message.action]=message.value;
      if(message.action==='delay'){s.delay=message.value;s.delaySeconds=[0,60,300,900][s.delay];}
      try{localStorage.setItem('hide-app-preview',JSON.stringify(s));}catch(e){}
      queueMicrotask(()=>HIDEApplyNative(s));
    }}}};
// App adaptation of the approved design: full-screen layout and unified controls.
(() => {
  const style = document.createElement('style');
  style.id = 'hide-app-layout';
  style.textContent = `
    html,body{width:100%;height:100%;overflow:hidden}
    body{display:block;padding:0;gap:0;background:#09090e}
    .phone{width:100%;height:100%;max-width:none;padding:0;border:0;border-radius:0;background:none;box-shadow:none}
    .screen{width:100%;height:100%;border-radius:0}
    .note{display:none}
    .header-actions{display:flex;align-items:center;gap:8px}
    .close-settings{width:34px;height:34px;display:grid;place-items:center;background:#17171f;border:1px solid #23232e;border-radius:20px;color:var(--ac);cursor:pointer}
    .glass .close-settings{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14)}
  `;
  document.head.appendChild(style);
  const icon = paths => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
  const lock = F.find(f => f[0] === 'lock');
  lock[1] = icon('<rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/>');
  const screenshot = F.find(f => f[0] === 'ss');
  screenshot[3] = 'بدون تنبيه الطرف الثاني';
  screenshot[5] = 'Without notifying the other person';
  F.push(
    ['live',icon('<circle cx="12" cy="12" r="2"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4m8.4-8.4a6 6 0 0 1 0 8.4M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/>'),'مشاهدة البث بالخفاء','بدون ظهور اسمك','Anonymous live','Without showing your name',0,'w'],
    ['sv',icon('<rect x="3" y="3" width="18" height="18" rx="4"/><path d="m10 8 6 4-6 4z"/>'),'فيديو في ملصقات الستوري','إتاحة اختيار الفيديو من المعرض','Videos in story stickers','Allow videos from the gallery',0,'w'],
    ['timer',icon('<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6M12 2v3"/>'),'إظهار مؤقت الفيديو','يبقى ظاهرًا أثناء التشغيل','Keep video timer visible','While the video is playing',0,'w'],
    ['rp',icon('<path d="M3 11a9 9 0 1 0 3-6M3 3v6h6"/>'),'إخفاء إشعار إعادة العرض','بدون تنبيه الطرف الثاني','Hide replay notifications','Without notifying the other person',0,'w']
  );
  PAGES.find(p => p.id === 'dl').f.push('timer');
  PAGES.find(p => p.id === 'st').f.push('sv','live');
  PAGES.find(p => p.id === 'dm').f.splice(PAGES.find(p => p.id === 'dm').f.indexOf('ss')+1,0,'rp');
  const send = body => window.webkit.messageHandlers.hideSettings.postMessage(body);
  let nativeState = window.__HIDEInitialSnapshot;
  const originalRender = render;
  window.render = function () {
    originalRender();
    const top = document.querySelector('#p .top');
    if (top) {
      const actions = document.createElement('div');actions.className = 'header-actions';
      const badge = top.querySelector('.vp');badge.textContent = 'v' + (nativeState.version || V);
      actions.appendChild(badge);
      const close = document.createElement('button');close.className = 'close-settings';
      close.dataset.nativeAction = 'close';close.setAttribute('aria-label',T('إغلاق الإعدادات','Close settings'));
      close.innerHTML = icon('<path d="m6 6 12 12M18 6 6 18"/>');
      actions.appendChild(close);top.appendChild(actions);
    }
    const foot = document.querySelector('#p .foot');
    if (foot) foot.textContent = `HIDE v${nativeState.version || V} · hide-plus.com`;
    if (nativeState?.delaySeconds === 3600) {
      const pill = document.querySelector('[data-delay] .pill');
      if (pill) pill.textContent = T('ساعة', '1 hour');
    }
    if (page === 'more') {
      const about = [...document.querySelectorAll('#p .tile.act')].filter(e => !e.hasAttribute('data-f') && !e.hasAttribute('data-delay'));
      if (about.length >= 3) {
        about[about.length - 3].querySelector('.ds').textContent = 'HIDE ' + (nativeState.version || V);
        about[about.length - 2].dataset.nativeAction = 'instagram';
        const report = about[about.length - 1];
        report.dataset.nativeAction = 'report';
        report.querySelector('.ds').textContent = T('اضغط لعرض تقرير التوافق', 'Tap to view compatibility report');
      }
    }
  };
  window.HIDEApplyNative = snapshot => {
    nativeState = snapshot;
    for (const feature of F) st[feature[0]] = snapshot.features[feature[0]] ? 1 : 0;
    lang = snapshot.language;
    color = snapshot.color;
    glass = snapshot.glass;
    delay = snapshot.delay;
    const scroll = document.getElementById('p')?.scrollTop || 0;
    render();
    document.getElementById('p').scrollTop = scroll;
  };
  document.addEventListener('click', event => {
    const target = event.target.closest('[data-f],[data-delay],[data-c],[data-g],[data-l],[data-t],[data-native-action]');
    if (!target) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    if (target.hasAttribute('data-f')) {
      const id = target.dataset.f;
      if (!nativeState.available[id]) {
        toast(T('الميزة غير متاحة في هذه النسخة', 'Unavailable in this build'));
        return;
      }
      send({action: 'feature', id, value: !st[id]});
    } else if (target.hasAttribute('data-delay')) {
      send({action: 'delay', value: (delay + 1) % DELAYS.length});
    } else if (target.hasAttribute('data-c')) {
      send({action: 'color', value: Number(target.dataset.c)});
    } else if (target.hasAttribute('data-g')) {
      send({action: 'glass', value: target.dataset.g === '1'});
    } else if (target.hasAttribute('data-l')) {
      send({action: 'language', value: target.dataset.l});
    } else {
      send({action: target.dataset.nativeAction || (target.dataset.t === 'ig' ? 'instagram' : 'whatsapp')});
    }
  }, true);
  HIDEApplyNative(nativeState);
})();

</script>
