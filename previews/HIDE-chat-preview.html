<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HIDE · معاينة المحادثة</title>
<style>
:root{color-scheme:dark;--bg:#0a1014;--panel:#171f24;--text:#f5f6f7;--muted:#8d99a3;--line:#222b32;--purple:#783cff;--red:#d52d40}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid #b69aff;outline-offset:4px}svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.app{height:100dvh;min-height:420px;max-width:760px;margin:auto;display:flex;flex-direction:column;background:var(--bg);position:relative}.notice{font-size:11px;color:#a7adb5;text-align:center;padding:9px 12px;background:#131923;border-bottom:1px solid var(--line);letter-spacing:.1px}.top{display:flex;align-items:center;gap:12px;padding:16px 16px 15px;border-bottom:1px solid var(--line);direction:ltr}.icon{border:0;background:none;padding:7px;display:grid;place-items:center;border-radius:13px}.avatar{width:42px;height:42px;border-radius:50%;background:#16287e;border:1px solid #394bac;display:grid;place-items:center;font-size:24px;font-weight:900;font-style:italic}.identity{min-width:0;flex:1;text-align:left}.identity b{font-size:16px;display:block}.identity small{font-size:12px;color:var(--muted);display:block;margin-top:3px}.actions{display:flex;gap:5px;align-items:center}.eye{position:relative;color:#e8eaf0;transition:background .2s,color .2s}.eye.sent{color:#9e84ff;background:#211c36}.eye-label{position:absolute;top:42px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;color:#b2a0e6;display:none}.eye.sent .eye-label{display:block}.messages{overflow-y:auto;flex:1;padding:24px 18px 30px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}.day{align-self:center;color:var(--muted);font-size:11px;padding:3px 0 13px}.row{display:flex;gap:8px;align-items:flex-end;direction:ltr}.row.mine{justify-content:flex-end}.mini-avatar{width:28px;height:28px;border-radius:50%;background:#16287e;display:grid;place-items:center;font-size:17px;font-weight:900;font-style:italic;flex-shrink:0}.bubble{max-width:80%;border:0;border-radius:23px;background:#242c32;padding:13px 18px;text-align:right;line-height:1.65;font-size:15px;direction:rtl;overflow-wrap:anywhere}.mine .bubble{background:var(--purple)}.deleted{background:var(--red);color:#fff;text-align:right;box-shadow:0 5px 18px #d52d4015}.deleted .body{display:block;color:#fff}.deleted .caption{font-size:10px;color:#fff;opacity:.87;display:flex;gap:5px;align-items:center;margin-top:5px}.deleted .caption svg{width:12px;height:12px;stroke-width:2}.time{font-size:10px;color:var(--muted);align-self:center;margin:9px 0}.separator{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:11px;margin:13px 0 4px}.separator:before,.separator:after{content:"";height:1px;background:#3c474f;flex:1}.hint{font-size:11px;line-height:1.8;color:var(--muted);margin:5px 0 0 36px;text-align:left;direction:rtl}.composer{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:12px 16px max(14px,env(safe-area-inset-bottom));direction:ltr}.input{flex:1;background:#1a2227;border-radius:28px;padding:13px 15px;color:#8e9ba5;font-size:14px;display:flex;align-items:center;gap:10px}.input span{flex:1}.camera{width:37px;height:37px;display:grid;place-items:center;border-radius:50%;background:var(--purple)}.camera svg{width:21px}.status{min-height:35px;padding:0 16px 10px;text-align:center;color:#a5afb8;font-size:11px;line-height:1.6}.sheet-backdrop{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:12px}.sheet-backdrop[hidden]{display:none}.sheet{width:100%;max-width:520px;background:#20272d;border:1px solid #343e46;border-radius:27px;padding:10px 22px 23px;box-shadow:0 24px 90px #0009}.handle{width:36px;height:4px;border-radius:10px;background:#65717b;margin:0 auto 21px}.sheet h2{font-size:18px;margin:0 0 10px}.sheet p{font-size:13px;line-height:1.9;color:#c1c9d0;margin:0 0 16px}.date-line{display:flex;align-items:center;gap:12px;padding:14px;background:#2b343c;border-radius:16px;margin:17px 0}.date-icon{display:grid;place-items:center;color:#ff7e8c}.date-line strong{font-size:13px;display:block;line-height:1.8}.date-line small{font-size:11px;color:#b2bec8}.sheet-footer{margin-top:17px;display:flex;gap:9px}.sheet-footer button{flex:1;border:0;border-radius:14px;padding:13px;background:#303b44;font-size:14px}.sheet-footer .primary{background:var(--purple);font-weight:600}.mock-note{font-size:11px!important;color:#919da8!important;margin-top:11px!important}.toast{position:fixed;top:100px;left:50%;transform:translateX(-50%);max-width:90%;padding:11px 18px;background:#eaeef3;color:#17202a;border-radius:17px;z-index:40;font-size:12px;text-align:center;box-shadow:0 5px 30px #0006}.toast[hidden]{display:none}@media(max-width:360px){.top{gap:8px;padding-inline:10px}.actions{gap:0}.actions .optional{display:none}.bubble{max-width:84%}.messages{padding-inline:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg style="display:none" aria-hidden="true"><defs>
<symbol id="eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="camera" viewBox="0 0 24 24"><path d="M8 5h8l2 3h3v12H3V8h3Z"/><circle cx="12" cy="13" r="4"/></symbol>
<symbol id="phone" viewBox="0 0 24 24"><path d="M7 3 4 5c-2 3 7 16 12 15l4-3-4-4-3 2-5-6 2-3Z"/></symbol>
<symbol id="video" viewBox="0 0 24 24"><rect x="2" y="5" width="14" height="14" rx="4"/><path d="m16 9 6-3v12l-6-3"/></symbol>
</defs></svg>
<main class="app">
<div class="notice">معاينة تصميم فقط · الأسماء والرسائل والتوقيت أمثلة</div>
<header class="top">
<button class="icon" aria-label="رجوع" id="back"><svg viewBox="0 0 24 24"><path d="m15 4-8 8 8 8"/></svg></button>
<div class="avatar" aria-hidden="true">H</div><div class="identity"><b>hide.example</b><small>محادثة تجريبية</small></div>
<div class="actions"><button class="icon eye" id="markSeen" aria-label="إرسال قراءة المحادثة يدويًا" title="إرسال القراءة يدويًا"><svg><use href="#eye"/></svg><span class="eye-label">تمت القراءة</span></button><button class="icon" aria-label="اتصال تجريبي" data-demo><svg><use href="#phone"/></svg></button><button class="icon optional" aria-label="فيديو تجريبي" data-demo><svg><use href="#video"/></svg></button></div>
</header>
<section class="messages" aria-label="رسائل نموذجية">
<div class="day">اليوم · محادثة للمعاينة</div>
<div class="row"><span class="mini-avatar" aria-hidden="true">H</span><div class="bubble">هلا، كيف حالك؟</div></div>
<div class="row mine"><div class="bubble">بخير، حياك الله</div></div>
<div class="time">٧:٤٠ ص</div>
<div class="row"><span class="mini-avatar" aria-hidden="true">H</span><button class="bubble deleted" data-deleted="1" aria-label="رسالة محذوفة: هلا، بمر عليك اليوم. عرض وقت الحذف"><span class="body">هلا، بمر عليك اليوم</span><span class="caption"><svg><use href="#clock"/></svg>رسالة محذوفة</span></button></div>
<div class="row mine"><div class="bubble">تمام، انتظرك</div></div>
<div class="separator">رسائل جديدة</div>
<div class="row"><span class="mini-avatar" aria-hidden="true">H</span><button class="bubble deleted" data-deleted="2" aria-label="رسالة محذوفة: خلنا نتقابل الساعة ثمان. عرض وقت الحذف"><span class="body">خلنا نتقابل الساعة ثمان</span><span class="caption"><svg><use href="#clock"/></svg>رسالة محذوفة</span></button></div>
<p class="hint">اضغط الرسالة الحمراء لعرض تاريخ ووقت حذفها.</p>
</section>
<div class="status" id="readStatus" role="status">إخفاء القراءة مفعّل · زر العين يرسل القراءة عند اختيارك فقط</div>
<footer class="composer" aria-label="حقل رسالة للعرض فقط"><div class="camera"><svg><use href="#camera"/></svg></div><div class="input"><span>رسالة…</span><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3Z"/><path d="M5 11v1a7 7 0 0 0 14 0v-1M12 19v3M9 22h6"/></svg><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m3 17 6-7 5 5 3-3 4 5"/></svg></div></footer>
</main>
<div class="sheet-backdrop" id="overlay" hidden><section class="sheet" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1"><div class="handle" aria-hidden="true"></div><h2 id="dialogTitle"></h2><div id="dialogContent"></div><div class="sheet-footer" id="dialogActions"></div></section></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
const overlay=document.getElementById('overlay'),dialog=document.getElementById('dialog');let lastFocus;
const dates={1:['الثلاثاء، ٣ نوفمبر ٢٠٢٦','٧:٤٠ ص'],2:['الثلاثاء، ٣ نوفمبر ٢٠٢٦','٧:٤٢ ص']};
function closeSheet(){overlay.hidden=true;lastFocus?.focus()}
function openSheet(title,content,buttons){lastFocus=document.activeElement;document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogContent').innerHTML=content;const actions=document.getElementById('dialogActions');actions.replaceChildren();buttons.forEach(({label,primary,action})=>{const b=document.createElement('button');b.textContent=label;if(primary)b.className='primary';b.onclick=action;actions.appendChild(b)});overlay.hidden=false;dialog.focus()}
document.querySelectorAll('[data-deleted]').forEach(button=>button.onclick=()=>{const [date,time]=dates[button.dataset.deleted];openSheet('تاريخ ووقت الحذف',`<div class="date-line"><span class="date-icon"><svg><use href="#clock"/></svg></span><div><strong>${date}</strong><small>${time}</small></div></div><p class="mock-note">هذا توقيت تجريبي لتوضيح شكل النافذة.</p>`,[{label:'تم',primary:true,action:closeSheet}])});
document.getElementById('markSeen').onclick=()=>openSheet('إرسال قراءة المحادثة؟','<p>بهذا الاختيار سيظهر للطرف الثاني أنك قرأت هذه المحادثة، مع بقاء إعداد إخفاء القراءة مفعّلًا.</p><p class="mock-note">هذه معاينة فقط؛ لن تُرسل قراءة فعلية إلى إنستغرام.</p>',[{label:'إلغاء',action:closeSheet},{label:'إرسال القراءة',primary:true,action:()=>{closeSheet();document.getElementById('markSeen').classList.add('sent');document.getElementById('readStatus').textContent='معاينة: أُرسلت القراءة لهذه المحادثة يدويًا · إخفاء القراءة ما زال مفعّلًا';showToast('محاكاة إرسال القراءة فقط')}}]);
function showToast(text){const el=document.getElementById('toast');el.textContent=text;el.hidden=false;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.hidden=true,2300)}
document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>showToast('زر للعرض فقط في هذه المعاينة'));
document.getElementById('back').onclick=()=>showToast('أنت داخل معاينة المحادثة');
overlay.addEventListener('click',e=>{if(e.target===overlay)closeSheet()});
document.addEventListener('keydown',e=>{if(overlay.hidden)return;if(e.key==='Escape'){closeSheet();return}if(e.key==='Tab'){const buttons=[...dialog.querySelectorAll('button')];const first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===dialog)){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===dialog)){e.preventDefault();first.focus()}}});
</script>
</body></html>
