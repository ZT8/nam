<meta charset="utf-8">

<style>
  :root { --blue:#336bff; --purple:#8c4dff; --text:#fff; --sub:rgba(255,255,255,.55); --glass:rgba(255,255,255,.07); --edge:rgba(255,255,255,.13); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#05060f; font-family:-apple-system,"SF Pro Text","Segoe UI",Tahoma,sans-serif; color:var(--text); display:flex; flex-direction:column; align-items:center; padding:24px 16px; gap:16px; }
  .langs { display:flex; gap:8px; }
  .langs button { background:rgba(255,255,255,.08); color:#fff; border:1px solid var(--edge); border-radius:16px; padding:8px 18px; font-size:15px; cursor:pointer; backdrop-filter:blur(10px); }
  .langs button.on { background:var(--blue); border-color:transparent; }
  .phone { width:100%; max-width:390px; background:#000; border-radius:46px; padding:11px; box-shadow:0 0 0 2px #1c1c22, 0 30px 80px rgba(0,0,0,.7); }
  .screen { position:relative; border-radius:36px; height:800px; overflow:hidden; background:linear-gradient(135deg,#080a1c,#101640 55%,#06081a); }
  .orb { position:absolute; width:280px; height:280px; border-radius:50%; filter:blur(70px); opacity:.55; }
  .o1 { background:var(--blue); top:-60px; left:-80px; }
  .o2 { background:var(--purple); top:300px; right:-120px; }
  .o3 { background:#00beff; bottom:-80px; left:-40px; opacity:.4; }
  .scroll { position:absolute; inset:0; overflow-y:auto; scrollbar-width:none; }
  .scroll::-webkit-scrollbar { display:none; }
  .nav { position:sticky; top:0; z-index:3; height:56px; display:flex; align-items:center; justify-content:center; background:rgba(10,12,30,.35); backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%); border-bottom:1px solid rgba(255,255,255,.06); }
  .nav h1 { font-size:17px; font-weight:600; }
  .nav .done { position:absolute; inset-inline-end:20px; font-size:17px; font-weight:600; }
  .glass { background:var(--glass); border:1px solid var(--edge); backdrop-filter:blur(26px) saturate(170%); -webkit-backdrop-filter:blur(26px) saturate(170%); }
  .hero { margin:16px 20px 6px; border-radius:28px; padding:20px 0 18px; text-align:center; }
  .mark { width:64px; height:64px; margin:0 auto; border-radius:18px; background:linear-gradient(135deg,var(--blue),var(--purple)); display:grid; place-items:center; font-size:36px; font-weight:900; box-shadow:0 8px 24px rgba(51,107,255,.45); }
  .brand { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:10px; }
  .logo { font-size:30px; font-weight:800; letter-spacing:.5px; }
  .ver { font-size:13px; font-weight:600; padding:2px 9px; border-radius:10px; background:rgba(51,107,255,.45); border:1px solid rgba(255,255,255,.25); font-variant-numeric:tabular-nums; }
  .site { color:rgba(255,255,255,.6); font-size:14px; font-weight:500; margin-top:4px; }
  .sec-title { color:var(--sub); font-size:13px; font-weight:600; letter-spacing:.4px; text-transform:uppercase; padding:20px 36px 7px; }
  .group { border-radius:22px; margin:0 16px; overflow:hidden; }
  .row { display:flex; align-items:center; gap:14px; min-height:54px; padding:10px 16px; position:relative; }
  .row + .row::before { content:""; position:absolute; top:0; inset-inline-start:60px; inset-inline-end:0; height:1px; background:rgba(255,255,255,.10); }
  .ic { width:30px; height:30px; border-radius:8px; display:grid; place-items:center; flex:none; font-size:15px; }
  .t { flex:1; font-size:16px; font-weight:500; line-height:1.3; }
  .v { color:var(--sub); font-size:15px; white-space:nowrap; }
  .chev { color:var(--sub); margin-inline-start:6px; }
  .sw { border:0; padding:0; display:block; width:51px; height:31px; border-radius:16px; background:rgba(255,255,255,.16); position:relative; flex:none; cursor:pointer; transition:background .2s; }
  .sw::after { content:""; position:absolute; top:2px; inset-inline-start:2px; width:27px; height:27px; border-radius:50%; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.3); transition:transform .2s; }
  .sw:focus-visible { outline:2px solid white; outline-offset:3px; }
  .sw.on { background:var(--blue); }
  .sw.on::after { transform:translateX(20px); }
  [dir=rtl] .sw.on::after { transform:translateX(-20px); }
  .foot { text-align:center; color:rgba(255,255,255,.35); font-size:12px; font-weight:500; padding:24px 0 36px; }
  .note { color:rgba(255,255,255,.5); font-size:13px; text-align:center; max-width:390px; line-height:1.5; }

function render(lang){
  const d=S[lang], scr=document.getElementById('screen');
  scr.dir = lang==='ar'?'rtl':'ltr';
  document.documentElement.lang = lang;
  let h=`<div class="nav"><h1>${d.title}</h1><span class="done">${d.done}</span></div>
    <div class="hero glass"><div class="mark">H</div>
      <div class="brand"><span class="logo">HIDE</span><span class="ver">v${V}</span></div>
      <div class="site">hide-plus.com</div></div>`;
  for(const [sectionIndex,[t,rows]] of d.secs.entries()){
    h+=`<div class="sec-title">${t}</div><div class="group glass">`;
    for(const [rowIndex,r] of rows.entries()){
      const stateKey = r[5] || `${sectionIndex}:${rowIndex}`;
      const on = typeof previewState[stateKey] === "boolean" ? previewState[stateKey] : Boolean(r[1]);
      const icon=`<span class="ic" style="background:${r[3]}">${r[2]}</span>`;
      if(typeof r[1]==='number') h+=`<div class="row">${icon}<span class="t">${r[0]}</span><button type="button" class="sw${on?' on':''}" role="switch" aria-label="${r[0]}" aria-checked="${on}" data-state-key="${stateKey}"></button></div>`;
      else h+=`<div class="row">${icon}<span class="t">${r[0]}</span><span class="v">${r[1]}${r[4]?'':'<span class="chev">'+(lang==='ar'?'‹':'›')+'</span>'}</span></div>`;
    }
    h+=`</div>`;
  }
  h+=`<div class="foot">HIDE v${V} · hide-plus.com</div>`;
  scr.innerHTML=h;
  scr.querySelectorAll('.sw').forEach(s=>s.onclick=()=>{
    const on = s.getAttribute('aria-checked') !== 'true';
    s.classList.toggle('on',on); s.setAttribute('aria-checked',String(on));
    previewState[s.dataset.stateKey] = on;
    try { localStorage.setItem('hide-preview-state-1.9',JSON.stringify(previewState)); } catch (_) {}
  });
  document.getElementById('note').textContent=d.note;
  document.getElementById('en').classList.toggle('on',lang==='en');
  document.getElementById('ar').classList.toggle('on',lang==='ar');
}
document.getElementById('en').onclick=()=>render('en');
document.getElementById('ar').onclick=()=>render('ar');
